name: macOS client checks

on:
  push:
    paths:
      - "macos/**"
      - "scripts/build-macos-app.sh"
      - "scripts/test-macos.sh"
      - ".github/workflows/build-macos-client.yml"
  pull_request:
    paths:
      - "macos/**"
      - "scripts/build-macos-app.sh"
      - "scripts/test-macos.sh"
      - ".github/workflows/build-macos-client.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos-client-${{ github.ref }}
  cancel-in-progress: true

jobs:
  swift-package:
    name: Swift build and test
    runs-on: macos-15
    defaults:
      run:
        working-directory: macos

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Show Swift toolchain
        run: swift --version

      - name: Build debug client
        run: swift build

      - name: Run tests
        run: ../scripts/test-macos.sh

      - name: Build release client
        run: swift build --configuration release
