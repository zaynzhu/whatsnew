name: whatsnew

services:
  cache-init:
    image: ${WHATSNEW_BACKEND_IMAGE:-whatsnew-backend:latest}
    platform: ${WHATSNEW_PLATFORM:-linux/amd64}
    user: "0:0"
    environment:
      TARGET_GID: ${WHATSNEW_PGID:-1000}
      TARGET_UID: ${WHATSNEW_PUID:-1000}
    entrypoint:
      - /bin/sh
      - -c
    command:
      - |
        set -eu
        mkdir -p /app/backend/.cache/posters /app/backend/.cache/poster-variants /app/backend/.cache/imdb
        chown -R "$${TARGET_UID}:$${TARGET_GID}" /app/backend/.cache
    volumes:
      - ${WHATSNEW_DATA_DIR:-./runtime/data}/cache:/app/backend/.cache
    restart: "no"

  backend:
    image: ${WHATSNEW_BACKEND_IMAGE:-whatsnew-backend:latest}
    platform: ${WHATSNEW_PLATFORM:-linux/amd64}
    env_file:
      - ${WHATSNEW_CONFIG_DIR:-./runtime/config}/settings.env
    environment:
      NODE_ENV: production
      PORT: 19993
      SETTINGS_ENV_PATH: /app/config/settings.env
      TZ: ${WHATSNEW_TIMEZONE:-Asia/Shanghai}
    user: "${WHATSNEW_PUID:-1000}:${WHATSNEW_PGID:-1000}"
    init: true
    restart: unless-stopped
    stop_grace_period: 1m
    depends_on:
      cache-init:
        condition: service_completed_successfully
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${WHATSNEW_BACKEND_BIND_ADDRESS:-127.0.0.1}:${WHATSNEW_BACKEND_PORT:-19993}:19993"
    volumes:
      - ${WHATSNEW_CONFIG_DIR:-./runtime/config}:/app/config
      - ${WHATSNEW_DATA_DIR:-./runtime/data}/cache:/app/backend/.cache
    logging:
      driver: json-file
      options:
        max-size: ${WHATSNEW_LOG_MAX_SIZE:-10m}
        max-file: "${WHATSNEW_LOG_MAX_FILES:-3}"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:19993/api/health').then(response => { if (!response.ok) process.exit(1) }).catch(() => process.exit(1))"
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

  frontend:
    image: ${WHATSNEW_FRONTEND_IMAGE:-whatsnew-frontend:latest}
    platform: ${WHATSNEW_PLATFORM:-linux/amd64}
    init: true
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${WHATSNEW_BIND_ADDRESS:-0.0.0.0}:${WHATSNEW_FRONTEND_PORT:-19992}:80"
    logging:
      driver: json-file
      options:
        max-size: ${WHATSNEW_LOG_MAX_SIZE:-10m}
        max-file: "${WHATSNEW_LOG_MAX_FILES:-3}"
    healthcheck:
      test:
        - CMD-SHELL
        - wget -qO- http://127.0.0.1/healthz >/dev/null || exit 1
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
