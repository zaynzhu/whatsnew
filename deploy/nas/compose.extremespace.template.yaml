name: whatsnews

services:
  backend:
    image: whatsnew-backend:__VERSION__
    platform: linux/amd64
    env_file:
      - ./config/settings.env
    environment:
      NODE_ENV: production
      PORT: 19993
      SETTINGS_ENV_PATH: /app/config/settings.env
      TZ: Asia/Shanghai
    user: "1000:1000"
    init: true
    restart: unless-stopped
    stop_grace_period: 1m
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "50016:19993"
    volumes:
      - ./config:/app/config
      - ./backend:/app/backend/.cache
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:19993/api/health').then(response => { if (!response.ok) process.exit(1) }).catch(() => process.exit(1))"
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

  frontend:
    image: whatsnew-frontend:__VERSION__
    platform: linux/amd64
    init: true
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "50015:80"
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    healthcheck:
      test:
        - CMD-SHELL
        - wget -qO- http://127.0.0.1/healthz >/dev/null || exit 1
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
